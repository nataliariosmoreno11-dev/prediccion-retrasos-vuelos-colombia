name: Recopilar vuelos
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
        env:
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}

